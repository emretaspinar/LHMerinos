name: Send Order to Medipa

on:
  repository_dispatch:
    types: [new_order]

jobs:
  send-order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run order script
        env:
          MERINOS_EMAIL: ${{ secrets.MERINOS_EMAIL }}
          MERINOS_PASSWORD: ${{ secrets.MERINOS_PASSWORD }}
        run: python send_order.py
