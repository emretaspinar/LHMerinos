name: Merinos to GitHub Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        env:
          MERINOS_EMAIL: ${{ secrets.MERINOS_EMAIL }}
          MERINOS_PASSWORD: ${{ secrets.MERINOS_PASSWORD }}
        run: python sync_inventory.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add inventory.csv
          git diff --staged --quiet || git commit -m "Daily automated inventory sync from Merinos"
          git push
