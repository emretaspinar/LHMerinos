name: Merinos to GitHub Sync

on:
  schedule:
    - cron: '0 6 * * *' # Kører kl. 06:00 hver dag
  workflow_dispatch: # Gør det muligt at køre den manuelt

jobs:
  sync:
    runs-on: ubuntu-latest
    
    # VIKTIGT: Dette giver GitHub Action tilladelse til at skrive til repositoriet
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run update script
        env:
          MERINOS_EMAIL: ${{ secrets.MERINOS_EMAIL }}
          MERINOS_PASSWORD: ${{ secrets.MERINOS_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}  # Sender din Classic Token med ind i scriptet
        run: python update_and_push.py
